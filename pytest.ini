# Version 1.0
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    db: needs a live MySQL connection (gc-ims_database)
    testdb: needs the destructive test DB (gc-ims_database_test)
    slow: takes more than ~1s per test (parse of a 90MB file, PNG render)
